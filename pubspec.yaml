name: photo_permis_snippets
description: Widget Flutter professionnel pour photos d'identité avec détection de visage
version: 2.0.0
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Caméra et capture
  camera: ^0.10.5
  image_picker: ^1.0.4

  # Traitement d'images
  flutter_image_compress: ^2.1.0
  image: ^4.1.3

  # Stockage et galerie
  path_provider: ^2.1.1
  photo_manager: ^2.8.0

  # ML Kit pour détection de visage
  google_mlkit_face_detection: ^0.9.0

  # Utils
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# Notes:
# - Toutes les dépendances sont requises pour le bon fonctionnement
# - google_mlkit_face_detection nécessite iOS 11.0+ et Android API 21+
# - camera nécessite les permissions natives (Info.plist et AndroidManifest.xml)
# - photo_manager nécessite les permissions galerie
